<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e7dcc4"/>
    </pattern>
  </defs>
  <rect width="620" height="820" rx="14" fill="#fffaf0"/>
  <rect width="620" height="820" rx="14" fill="url(#dots)"/>
  <line x1="70" y1="0" x2="70" y2="820" stroke="#f3b9b9" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#4a4f63">
    <text x="100" y="70" font-size="26" font-weight="bold">Math Quiz — Fractions</text>
    <text x="100" y="100" font-size="16">Grade 4 · Name: ______________</text>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive" fill="#27348b" font-size="30">
    <text x="410" y="100" font-size="22">Salma A. · 4A</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#5b6075">
    <text x="90" y="190">1)  1/2 + 1/4 = ?</text>
    <text x="90" y="290">2)  3/4 + 2/4 = ?</text>
    <text x="90" y="390">3)  Lena hat 12 Äpfel. Sie gibt 1/3 ab.</text>
    <text x="118" y="418">Wie viele bleiben übrig?</text>
    <text x="90" y="520">4)  Write 9/4 as a mixed number.</text>
    <text x="90" y="630">5)  6 × 7 = ?</text>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive" fill="#27348b" font-size="34" font-style="italic">
    <text x="470" y="192">3/4</text>
    <text x="420" y="292">5/4 (1 1/4)</text>
    <text x="500" y="418">4</text>
    <text x="490" y="524">9/4</text>
    <text x="490" y="634">42</text>
  </g>
  <rect x="470" y="485" width="92" height="56" rx="8" fill="none" stroke="#f0a020" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="90" y="770" font-family="Arial, sans-serif" font-size="14" fill="#a39b86">Page 1 of 1</text>
</svg>
